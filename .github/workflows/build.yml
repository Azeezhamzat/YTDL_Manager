name: Build installers

# - Every push to main / pull request: run the test suite on macOS, Windows
#   and Linux.
# - A version tag (v0.2.0, ...) or a manual run from the Actions tab: also
#   build the app on each OS, smoke-test it, and package the downloads.
# - A version tag additionally publishes those downloads as a GitHub Release.
#
# PyInstaller can't cross-compile, so each OS builds its own installer here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # only used by the release job, to create the Release

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-14
            target: macos
          - name: Windows (x64)
            os: windows-2022
            target: windows
          - name: Linux (x86_64)
            # Oldest supported Ubuntu: the bundled libraries need at least
            # this glibc, so building here keeps the AppImage widely usable.
            os: ubuntu-22.04
            target: linux
    env:
      QT_QPA_PLATFORM: offscreen
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: System libraries Qt needs on Linux
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 file

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e . --no-deps

      - name: Lint and type-check
        if: matrix.target == 'linux'
        run: |
          ruff check src tests
          mypy src

      - name: Tests
        run: python -m pytest -q --ignore=tests/test_integration_real_download.py

      - name: Build the app (PyInstaller)
        if: env.PACKAGE == 'true'
        working-directory: packaging
        run: pyinstaller pyinstaller.spec --noconfirm

      - name: Smoke-test the built app
        if: env.PACKAGE == 'true'
        run: python packaging/smoke_test.py ${{ matrix.target }}

      - name: Package macOS disk image
        if: env.PACKAGE == 'true' && matrix.target == 'macos'
        run: bash packaging/macos/build_dmg.sh

      - name: Package Windows installer and portable zip
        if: env.PACKAGE == 'true' && matrix.target == 'windows'
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1

      - name: Package Linux AppImage and tarball
        if: env.PACKAGE == 'true' && matrix.target == 'linux'
        run: bash packaging/linux/build_appimage.sh

      - name: Upload downloads
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YTDLManager-${{ matrix.target }}
          path: packaging/release/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Checksums
        working-directory: release
        run: sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
